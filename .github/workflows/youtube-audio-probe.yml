name: Music YouTube Audio and Lyrics Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube-audio-probe.yml"
      - "tools/youtube_audio_probe.py"
      - "tools/lyric_audio_verify.py"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      query:
        description: "Song title and artist (leave empty for a random test)"
        required: false
        default: ""
      video_id:
        description: "Optional exact YouTube video ID"
        required: false
        default: ""

permissions:
  contents: read
  issues: read

concurrency:
  group: music-youtube-audio-probe
  cancel-in-progress: false

jobs:
  audio-and-lyrics-verification:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request == null && github.event.comment.user.login == github.repository_owner && startsWith(github.event.comment.body, '/music-test'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser, audio capture, and transcription tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio pulseaudio-utils
          python -m pip install --upgrade pip
          python -m pip install playwright faster-whisper
          python -m playwright install --with-deps chromium

      - name: Run requested or random song test
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_QUERY: ${{ inputs.query }}
          INPUT_VIDEO_ID: ${{ inputs.video_id }}
        run: |
          python - <<'PY'
          import os, random, subprocess, sys
          pool = [
              "모세 사랑인걸",
              "너드커넥션 좋은 밤 좋은 꿈",
              "너드커넥션 조용히 완전히 영원히",
              "아이유 밤편지",
              "잔나비 주저하는 연인들을 위해",
              "NewJeans Ditto",
              "The Weeknd Blinding Lights",
              "Coldplay Yellow",
              "Ed Sheeran Perfect",
              "윤하 사건의 지평선",
              "BTS Dynamite",
          ]
          query = os.getenv("INPUT_QUERY", "").strip()
          video_id = os.getenv("INPUT_VIDEO_ID", "").strip()
          if os.getenv("EVENT_NAME") == "issue_comment":
              body = os.getenv("COMMENT_BODY", "").strip()
              query = body[len("/music-test"):].strip()
          if not query and not video_id:
              query = random.choice(pool)
          command = [sys.executable, "tools/youtube_audio_probe.py", "--seconds", "45"]
          if video_id:
              command += ["--video-id", video_id]
          else:
              command += ["--query", query]
          print("Starting test:", query or video_id, flush=True)
          raise SystemExit(subprocess.call(command))
          PY

      - name: Upload verification report (no audio retained)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-audio-lyrics-verification
          path: youtube-audio-probe-report.json
          if-no-files-found: warn
          retention-days: 14
