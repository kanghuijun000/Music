name: Music YouTube Audio Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube-audio-probe.yml"
      - "tools/youtube_audio_probe.py"
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video ID (11 characters)"
        required: true
        default: "5vilULw-9Gg"
      seconds:
        description: "Capture duration (15–90 seconds)"
        required: true
        default: "35"

permissions:
  contents: read

concurrency:
  group: music-youtube-audio-probe
  cancel-in-progress: false

jobs:
  audio-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser and audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio pulseaudio-utils
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Play official YouTube embed and inspect real audio output
        id: probe
        continue-on-error: true
        env:
          YOUTUBE_TEST_VIDEO_ID: \${{ inputs.video_id }}
        run: |
          python tools/youtube_audio_probe.py --video-id "$YOUTUBE_TEST_VIDEO_ID" --seconds "\${{ inputs.seconds }}"

      - name: Upload numeric diagnostic report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-youtube-audio-probe
          path: youtube-audio-probe-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if playback audio could not be verified
        if: steps.probe.outcome == 'failure'
        run: exit 1
