name: Music YouTube Audio and Lyrics Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube-audio-probe.yml"
      - "tools/youtube_audio_probe.py"
      - "tools/lyric_audio_verify.py"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video ID (optional; empty selects a random test song)"
        required: false
        default: ""

permissions:
  contents: read
  issues: read

concurrency:
  group: music-youtube-audio-probe
  cancel-in-progress: false

jobs:
  audio-and-lyrics-verification:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request == null && github.event.comment.user.login == github.repository_owner && startsWith(github.event.comment.body, '/music-test'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser, audio capture, and transcription tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio pulseaudio-utils
          python -m pip install --upgrade pip
          python -m pip install playwright faster-whisper
          python -m playwright install --with-deps chromium

      - name: Run requested or random song test
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_VIDEO_ID: ${{ inputs.video_id }}
        run: |
          python - <<'PY'
          import os, random, re, subprocess, sys
          pool = [
              ("OneRepublic - Counting Stars", "5vilULw-9Gg"),
              ("Coldplay - Yellow", "yKNxeF4KMsY"),
              ("NewJeans - Ditto", "pSUydWEqKwE"),
              ("BTS - Dynamite", "gdZLi9oWNZg"),
          ]
          video_id = os.getenv("INPUT_VIDEO_ID", "").strip()
          label = ""
          if os.getenv("EVENT_NAME") == "issue_comment":
              body = os.getenv("COMMENT_BODY", "").strip()
              request = body[len("/music-test"):].strip()
              if request:
                  match = re.search(r"(?:video=)?([A-Za-z0-9_-]{11})", request)
                  if not match:
                      raise SystemExit("Use /music-test for random, or /music-test video=YOUTUBE_ID for a chosen song.")
                  video_id = match.group(1)
          if not video_id:
              label, video_id = random.choice(pool)
          command = [sys.executable, "tools/youtube_audio_probe.py", "--video-id", video_id, "--seconds", "45"]
          print("Starting test:", label or video_id, flush=True)
          raise SystemExit(subprocess.call(command))
          PY

      - name: Upload verification report (no audio retained)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-audio-lyrics-verification
          path: youtube-audio-probe-report.json
          if-no-files-found: warn
          retention-days: 14
